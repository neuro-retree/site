<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
<defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a3a69" stop-opacity="0.55"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#4a3a69" stop-opacity="0.6"/>
  </linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="0.5" stop-color="transparent"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
  </linearGradient>
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="gray"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/></filter>
</defs>
<rect width="300" height="400" fill="#4a3a69"/>
<rect width="300" height="400" fill="url(#g1)"/>
<rect width="300" height="400" fill="url(#g2)"/>
<rect width="300" height="400" filter="url(#noise)" opacity="0.7"/>
<rect width="300" height="400" fill="none" stroke="#6b5a8f" stroke-width="6" stroke-opacity="0.5" rx="4"/>
</svg>