<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
<!-- paper-edge.svg — профиль: торец/срез книжного блока (видны слои листов).
     Используется для узких граней (толщина блока страниц) и корешка открытой книги. -->
<defs>
  <pattern id="leaves" width="6" height="14" patternUnits="userSpaceOnUse">
    <rect width="6" height="14" fill="#efe3c6"/>
    <line x1="0" y1="7" x2="6" y2="7" stroke="#b9a67b" stroke-width="0.6" stroke-opacity="0.55"/>
    <line x1="0" y1="0" x2="6" y2="0" stroke="#cbb98f" stroke-width="0.4" stroke-opacity="0.5"/>
  </pattern>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff9e8" stop-opacity="0.9"/>
    <stop offset="0.45" stop-color="#f5ead0" stop-opacity="0.6"/>
    <stop offset="0.55" stop-color="#d9c9a4" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#8a744a" stop-opacity="0.8"/>
  </linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/></filter>
</defs>
<rect width="200" height="200" fill="#f2e6c8"/>
<rect width="200" height="200" fill="url(#leaves)"/>
<rect width="200" height="200" fill="url(#edge)"/>
<rect width="200" height="200" filter="url(#grain)"/>
</svg>